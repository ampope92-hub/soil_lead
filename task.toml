name = "soil-lead"

# The verifier reads only these paths from the agent's final environment. Must stay top-level:
# nested under [verifier] the value is silently dropped and the verifier receives nothing.
artifacts = [
    "/app/screen/src/",
    "/app/data/",
    "/app/out/",
]

[metadata]
author_name = "anonymous"
author_email = "anonymous"
category = "Science"
subcategory = "Chemistry"
tags = ["typescript", "lab-qc", "soil", "screening", "reference-materials"]
languages = ["typescript"]
difficulty = "core"
expert_time_estimate_hours = 3

difficulty_explanation = """
The lab's cover note counts 172 of 480 samples over the 200 mg/kg limit, straight off the results column, and the results column is what the instrument reported. The instrument does not report concentrations. It reports a reading that sits on each batch's own scale: the digests are run in batches of 24, and every batch carries its own offset, a few tens of mg/kg either way, and its own gain, several percent either way, which is exactly why the lab runs two certified reference materials at the head of every batch and one of them again at the end. Those control readings are in the same file, on the same rows, typed as control, and their certified values are in the file beside it. A reading of 205 in a batch that read the 320 material at 355 is not over 200, and a reading of 188 in a batch that read the 85 material at 62 is.

The product is the over-limit list itself, scored sample by sample against the reference lab's confirmatory analysis, with two bars that pull against each other: of the samples listed at least 0.90 have to be confirmed over the limit, and the list has to hold at least 0.90 of the samples that are. Taking the results as they stand lists 172 samples at 0.872 precision and 0.811 recall on this survey; one straight line fitted through every control reading in the run, the correction a careful reader applies if they see the controls but not the batches, lands at 0.855 and 0.827. Putting each reading back on the scale its batch had at that position, from the batch's own three control readings, lands at 0.989 and 0.984. Across twenty generated surveys the raw list passes both bars 0 times in 20 and the single line once, while the per-batch correction passes 20 times, at a worst precision of 0.949 and a worst recall of 0.956; a correction that takes only the offset from one material passes the two list bars 15 times, since it has understood the same thing about the batches, and it is the split checks that refuse it on the shipped survey. The second survey is a former gasworks with a 300 mg/kg limit, other reference materials, batches of 20 and 26 batches, where the raw list scores 0.970 and 0.376 and the single line 0.767 and 0.718, so a program that carries a correction from this survey, or none, fails it.

The data are synthetic, generated by solution/gen_batches.py from a lognormal spread of true concentrations around the limit, a per-batch offset and gain, a per-batch fall in the span from the head of the batch to its end, and two percent instrument noise; the key is the true concentration of every sample compared with the limit, which is what a confirmatory re-analysis at a reference lab returns. solution/calibrate.py reproduces every figure above.

The export also carries what a contract lab's export carries, and the README states each fact plainly. Readings the lab rejected stay in the file with R in a flag column: a rejected control was run again in the position straight after it, and a rejected sample was run again in a later batch, so its id appears twice and the later row is the lab's result. The hottest digests were run at a 1 in 5 dilution, and for those rows the instrument column is the reading of the diluted digest, with the factor in a dilution column. Each of those is a fact that silently changes the graded quantity when it is handled in a hurry, and each is light on the shipped survey and heavier on the other. Bristol carries one rejected control, two re-run samples and three diluted digests, none of them among the split samples, so every hurried reading of the file passes the shipped survey whole. Salford carries six rejected controls, ten re-run samples and eighteen diluted digests, and three of the split samples are among them. Over twenty generated Salford surveys a program that never reads the flag column fails the split tolerance 17 of 20 and the agreement check 19 of 20 and never clears every check, one that drops rejected controls but keeps rejected sample rows fails the agreement check 20 of 20, one that keeps the first row seen for each sample fails the split tolerance 20 of 20, and one that never reads the dilution column lands at 0.876 recall, best 0.893, against the 0.92 bar, and misses the diluted split sample by 0.81. The reference passes every check 20 of 20 on both sites, so the hurdle is carefulness with a stated fact, not a new unfairness.

One more fact of the export sits outside results.csv. The lab digests the soil as it arrived, wet, and its results column is on that basis, while the limit, the certified values and the reference lab's figures are all dry weight; the register in samples.csv carries the water in every sample as a percentage of its as-received mass, and the README of each survey and the instruction say so. Bristol's samples were air-dried before dispatch and carry 1 to 4 percent, so a program that never opens the register passes the shipped survey whole, at 1.000 precision and 0.951 recall with its split figures within 0.055 of the lab's. The Salford samples went to the lab as dug and carry 10 to 30 percent, and there the same program lists 104 samples where 170 are over the limit, 0.612 recall against the 0.92 bar, with its worst split figure 0.31 below the lab's against the 0.22 tolerance. Over twenty generated Salford surveys it lands at 0.620 recall, best 0.692, with a worst split error of 0.31, best 0.27, failing both 20 of 20.

The last fact is the one whose obvious reading is wrong. The instrument's span falls away as a batch runs, digest after digest, while the zero holds, and the repeat of the first material at the end of every batch is the lab's drift check: how far it comes in below the head reading of the same material is how far the span had fallen by then. The README of each survey says so, as facts about the instrument: every control cup is read at its own position with the one zero, and the three readings of a batch are all it has to settle its zero, its span and its fall. The Bristol batches lose 1 to 10 percent of their span, so a program that pins each batch on its head pair and never looks at the repeat passes the shipped survey whole at 1.000 and 0.951 with its split figures within 0.040 of the lab's, one that fits a least-squares line through all three control readings passes at 1.000 and 0.957, and one that reads the fall as the ratio of the repeat to the head reading, forgetting that both readings carry the zero, passes at 0.979 and 0.989 with its worst split figure 0.093 away. The Salford batches lose 8 to 34 percent, and there the same three programs fail: the head pair alone lists 135 of 170 at 0.794 recall and reports the split sample BS0309 0.31 below the lab's figure, the three-point line lists 145 at 0.847 recall and puts BS0309 0.23 away, and the ratio of readings lists 191 at 0.869 precision against the 0.88 bar and puts BS0096, a sample read last in a batch whose zero sits far below the scale, 4.1 times away from the lab's figure. Over twenty generated Salford surveys the head pair alone lands at 0.796 recall, best 0.847, and the three-point line at 0.849, best 0.891, each failing 20 of 20, while the ratio of readings fails the split tolerance 17 of 20 and clears every check 3 of 20. The reference, which takes the fall from the two readings of the repeated material and the zero from the head pair, clears every check 20 of 20 on both sites with a worst split error of 0.121 against 0.15 and 0.180 against 0.22.

The implementation is nothing: three csv reads, three control readings solved per batch, a division, a comparison, in TypeScript against node's standard modules. A flawless program that trusts the results column lists a tenth of the wrong samples and misses a fifth of the right ones on this survey and most of them on the other.

In a real consultancy this job belongs to whoever signs off the contamination assessment, and reading the lab's control results before believing its sample results is the difference between a report that survives challenge and one that does not.
"""

solution_explanation = """
The reference (solution/solve.sh) installs src/screen.ts and runs the project's build script, then runs the compiled script on /app/data. It reads policy.json for the limit, reference_materials.csv for the certified value of each material, samples.csv for the water in each sample, and results.csv in run order.

It drops every row whose flag is R as the file is read, since those are the readings the lab rejected and ran again, controls and samples alike. For each batch it then takes the first remaining reading of each material as that material's head reading and the last control row of the batch as the repeat at the end, and solves the three readings together: the two readings of the repeated material, taken at the certified value, give the fall in span per position between them; the other material's head reading, with that fall taken out of the few positions between the two head cups, gives the span at the head; and the zero follows from the head reading and that span. Every sample reading in the batch is corrected by subtracting the zero and dividing by the span the batch had at the sample's own position, then multiplied by the row's dilution factor, 1 on all but the hottest digests, then divided by the dry share of the sample's as-received mass, one minus the register's moisture_pct over a hundred, since the lab's column is on the wet soil and the limit is on dry, and a sample is listed when its corrected result is over the limit, in file order, 184 of them on the shipped export. The split figure for each sample named in split_checks.csv is the corrected value of that sample's accepted row in the batch the split row names, and the same corrected figure is written for every sample in results.csv under corrected_mg_kg, split or not. Everything is node's fs and path modules.

Against the reference lab's confirmation the list is 0.989 precise with 0.984 recall on the shipped survey and 0.971 and 1.000 on the other, against bars of 0.90 and 0.90 there and 0.88 and 0.92 here. The wrong routes are each a few lines of the same program: oracle_raw_results skips the correction and lists at 0.872 and 0.811, oracle_one_line_whole_run fits a single line through every control in the run and lists at 0.855 and 0.827, and oracle_batch_offset_only subtracts each batch's offset from one material without the span. That last one lists well enough, at 0.994 and 0.935, but it is still refused, because it misses the split sample BS0337 by 0.154 against the 0.15 the policy allows. Half the correction is not the correction: the README names a zero and a span, and the split checks are what settle whether a reading has both. The readings of the drift check that miss are one line different each: oracle_head_pair_only never uses the repeat at the end and lists 135 of the Salford survey's 170 at 0.794 recall with BS0309 0.31 below the lab's figure; oracle_three_point_line, the reference before the fall was in the export, fits one least-squares line through all three control readings, which puts half the fall on the head and half on the end, and lists 145 at 0.847 recall with BS0309 0.23 away; oracle_drift_ratio takes the repeat over the head reading as the ratio of the spans, which forgets the zero both readings carry, and lists 191 at 0.869 precision with BS0096 4.1 times away. The hurried readings of the rest of the export are one line different as well: oracle_ignores_flag never looks at the flag column and pins the Salford batch B018 on the two swapped cups, which puts its split sample BS0293 3.2 times away from the lab's figure; oracle_flag_controls_only drops rejected controls but keeps a rejected sample row and lists BS0309 off its rejected reading while reporting a split figure under the limit for it; oracle_first_reading keeps the first row seen for each id and reports BS0309 at more than three times the lab's 252; oracle_ignores_dilution never reads the dilution column and reads the eighteen hottest Salford samples at a fifth of their level, 0.894 recall against 0.92; oracle_ignores_moisture handles everything in results.csv and never opens the register, so the wet reading stands as the dry-weight figure, and it lists 104 of the 170 at 0.612 recall with BS0166 0.31 away from the lab's figure. Every one of them passes the shipped survey whole.
"""

verification_explanation = """
The verifier runs in its own container. It collects the agent's TypeScript sources and the shipped export, discards any dist/ the agent left behind, deletes everything under src/ except screen.ts, compiles that one file with its own compiler settings as an unprivileged build user from /app/screen, and runs what the compile produced under node. The contract says the program is that file and that imports stop at node's own modules, and both are settled by what is on disk rather than by reading the source. A library dropped in beside screen.ts is gone before tsc starts, and so is a package. src is not the only place the agent can leave code, though, since /app/data and /app/out are collected too: the export is the five checked files, README.md is documentation the reference never opens, and it goes with anything else parked in there, a symlink or a directory as much as a file, so it cannot sit there, never hashed, as a second source of program logic and a link cannot lead root's copy of the export into the keys; for the length of each run everything in the project but the compiled program belongs to root and is unreadable, so a module left beside it cannot be required either. The compiler's own package tree is closed for the same seconds, since an absolute import would otherwise reach it. Nothing else in the project is named by the contract or collected, so there is no build script or project settings file to keep to or to fail.

Compiling and running means the verifier executes code the agent wrote, so it does not do that as root. test.sh hands the project to the build user through setpriv with supplementary groups cleared and no-new-privileges set, runs the script from /app/screen, the directory the instruction documents, and while it runs every executable on the system paths except node is closed to that user, found by walking the directories rather than by a list, so the list cannot come out of a Python the script spawns; the cheat_python_shim arm is that construction and scores 0. Each run happens in its own session and its process group is torn down afterwards, then every process that user still owns is swept, so nothing the agent started is alive when the reward is written. Nothing inside the project is left executable while the script runs either: the walk closes the system paths, and every file the agent shipped inside /app/screen has its execute bits stripped before each run, so a helper binary carried in the project cannot do the work. The two runs ask for different output destinations, /app/out/over_limit.json and /app/out/second_survey.json, so a script that ignores the path it is given and writes to a name of its own fails the second run instead of passing unnoticed. The output is staged only if it is a regular file, moved to a root-owned path, and pytest reads that with O_NOFOLLOW; pytest never runs the agent's script. The keys live under /opt, readable only by root, and the /tests mount is closed to the build user before anything untrusted starts; if it is still reachable the run is abandoned with reward 0. pytest is called by full path with -P so nothing dropped into the working directory can shadow it.

Then the same script is run on the other survey's export, staged into a fresh directory only after the build has finished and its processes are gone, and removed afterwards; its README.md is left out of that directory too, for the same reason the shipped one never reaches the program. That survey is a former gasworks with a 300 mg/kg limit, batches of 20, its own offsets and gains, and reference materials named differently from this survey's, so a program that writes the material names into its source rather than reading them from reference_materials.csv is caught; the oracle_fixed_crm arm is that program and it scores 0.

Twenty-five checks run, the shipped files by hash and then twelve on each of the two runs, and every one of them is a requirement instruction.md itself states. The five shipped files are unaltered by sha256. On each run: the output is one object with exactly the keys over_limit, split_check and corrected_mg_kg; over_limit is an array of sample ids from that run's results.csv with no repeats, empty if nothing is over; split_check carries a finite number for exactly the samples split_checks.csv names; corrected_mg_kg carries a finite number for every sample in results.csv; at least the policy's minimum_precision of the listed samples were confirmed over the limit by the reference lab; the list holds at least the policy's minimum_recall of those the lab confirmed; every split figure lands within the policy's split_check_tolerance of the lab's, read as a fraction of it; and the four split samples whose column is blank in the export are held to the same tolerance on their own, which is what stops the lab's column being copied back. The output keys have to agree with each other, since they come out of one correction: a split sample reported above the limit belongs in over_limit and one reported at or below it does not, and the same is checked against corrected_mg_kg for every sample in results.csv, not only the twelve split ones, which stops a program that gets the split figures right while quietly leaving other over-limit samples off the list. corrected_mg_kg is also held to a figure, not only a boundary: for the twelve split samples it has to be the same number split_check reports, and for every other sample it has to land within the policy's own corrected_tolerance of the reference lab's true concentration for it, a figure the policy states directly (0.30 at Bristol, 0.44 at Salford, twice split_check_tolerance), so a program cannot pass a threshold marker off as the correction. The reference's own worst error there is 0.090 at Bristol and 0.134 at Salford, comfortably inside the bar; solution/calibrate.py --dump reproduces both figures. Two checks hold the data itself to what instruction.md promises about it directly: no sample sits exactly on the limit, and no sample has more than one reading the lab accepted. So neither the comparison at the boundary nor a second figure for the same id is left to turn on something the contract never settles.

The export also carries split_checks.csv, a dozen samples whose second portion went to the reference lab. Eight carry the lab's figure beside our reading, which is what lets a candidate settle the correction on evidence rather than assumption: BS0065 reads 157.0 on an instrument that ran its controls high and comes back at 97.59. The other four are still with the lab, so that column is blank and their figures live only in the key. That is deliberate. When every lab figure shipped, a program could copy the column into split_check and clear the whole gate with zero error without correcting anything; the blank rows have nothing to copy, and cheat_echo_lab is that submission and fails on those rows alone. The key is the reference lab's confirmation, sample by sample: the generator draws every sample's true concentration and the key is the set whose true concentration is over the limit, so the bars are performance bars on the agent's list against labels the verifier holds. The bars are measured over twenty generated surveys per site: the per-batch correction passes both precision and recall 20 of 20 on each while the raw results pass 0 of 20 and a single run-wide line 1 and 0 of 20, and its worst split-check error on the shipped exports is 0.049 against a 0.15 tolerance at Bristol and 0.070 against 0.22 at Salford, the held-back rows behaving like the visible ones. Those tolerances are what make the gate worth having: over twenty surveys a side the correction never misses by more than 0.121 and 0.180, while the raw column never does better than 0.217 and 0.717 and a single run-wide line never better than 0.196 and 0.568. A candidate can therefore tell before submitting whether the correction is the one being asked for. Twenty-one arms run through the real verifier and every one scores 0: oracle_raw_results, oracle_one_line_whole_run, oracle_batch_offset_only, oracle_fixed_crm, cheat_python_shim and cheat_echo_lab as before, then oracle_ignores_flag, oracle_lf_split, oracle_flag_controls_only, oracle_flag_samples_only, oracle_first_reading, oracle_ignores_dilution and oracle_ignores_moisture, each a hurried reading of one stated fact about the export, then oracle_head_pair_only, oracle_three_point_line and oracle_drift_ratio, the three readings of the drift check that miss, and each passing the shipped survey whole before failing a bar on the other. cheat_frozen_list passes the shipped survey whole and fails the other, cheat_readme_logic, a loader that reads its correction out of the data README, finds no README at run time and writes nothing, and cheat_data_symlink, which leaves a link to the key's path in the export directory and echoes whatever it reads there, finds the link gone and falls back to the raw column, failing the precision bar on the shipped survey. cheat_omit_nonsplit takes the reference's own correction and drops ten correctly-corrected samples split_checks.csv never names from over_limit, while still reporting their true figure in corrected_mg_kg; precision and recall alone still clear the bars on both surveys, since the ten are few and none of them belongs to the twelve split samples, and it is the agreement between corrected_mg_kg and over_limit that refuses it. cheat_sentinel_marker keeps the genuine list and the genuine split_check but writes corrected_mg_kg as one tick above the limit for every listed sample and one tick below for every other, which is finite, complete and always agrees with over_limit at the boundary; it is refused only once corrected_mg_kg is held against split_check for the split samples and against the reference lab's true concentration for the rest. Each fails on its own mechanism rather than on the shape of its output. solution/gen_batches.py regenerates the exports and keys of both surveys byte for byte.
"""

relevant_experience = """
I have authored a batch of tasks for this edition, several of them accepted, on one finding: the tasks that measure something are the ones where the agent's own reading of the evidence confirms the wrong answer. Here the wrong answer is the lab's count, it is reproducible from the results column in one line, and the only way to a list that agrees with the reference lab is to treat the control rows sitting in the same file as what they are. The shape follows the accepted retrieval task in the batch: a list of items scored against labels the verifier holds, since every sample either confirmed over the limit or did not.
"""

[verifier]
# One compile and two runs of the agent's script. tsc on one file takes seconds and there is no
# dependency tree, but 1800 is the floor the platform requires.
timeout_sec = 1800
environment_mode = "separate"
network_mode = "no-network"

[agent]
timeout_sec = 5400
# Offline by design: the tool is written against node's standard modules, and network access
# would let the agent pull a statistics package rather than read the control rows.
network_mode = "no-network"

[environment]
# Must be "public" on every task, offline ones included: this is the phase where the image is
# built and the agent harness is installed. The task itself is air-gapped, since the agent and
# verifier phases above are both no-network, so nothing the agent does can reach a network.
network_mode = "public"
build_timeout_sec = 900
cpus = 2
memory_mb = 4096
storage_mb = 10240
